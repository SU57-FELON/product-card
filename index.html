<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Product card</title>
</head>

<body style="font-family: Montserrat;">
  <button id="recolor-the-first-card">Перекрасить фон первой карточки</button>
  <button id="recolor-all-card-button">Перекрасить фон всех карточек</button>
  <button id="open-google-button">Открыть Google</button>
  <button id="toggle-btn" class="toggle-button">Change of color</button>
  <div class="container">
    <div class="hero-wrapper">
      <h1 class="hero-wrapper-text" id="main-title">Выбери свой продукт</h1>
    </div>
    <div class="product-card-wrapper">
      <template id="product-card-template">
        <div class="product-card">
          <img src="" alt="" class="product-card__img">
          <p class="product-card__for-skin"></p>
          <h2 class="product-card__title"></h2>
          <p class="product-card__description"></p>
          <span class="product-card__text">Состав:</span>
          <ul class="product-card__composition"></ul>
          <div class="product-card__price-wrapper">
            <span class="product-card__price-text">Цена</span>
            <span class="product-card__price"></span>
          </div>
        </div>
      </template>
    </div>
  </div>
<script type="module" src="homework-8.js"></script>
</body>

</html>
